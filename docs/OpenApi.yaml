  # ============================================================
  # DSS ENGINE
  # ============================================================
  /dss/weights:
    get:
      summary: Get current weight configuration
      description: |
        Returns all top-level weight criteria with their sub-weights.
        The `subWeightFrom: null` filter ensures only parent weights are returned,
        each with a nested `subWeights` array. Requires authentication.
      tags: [DSS Engine]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Weight configuration retrieved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/WeightItem'
              example:
                statusCode: 200
                success: true
                message: "Success"
                data:
                  - key: "c1"
                    name: "Usia Bangunan"
                    type: "cost"
                    value: 0.20
                    subWeightFrom: null
                    subWeights: []
                  - key: "c2"
                    name: "Kondisi Fisik"
                    type: "benefit"
                    value: 0.35
                    subWeightFrom: null
                    subWeights:
                      - key: "c21"
                        name: "Struktur"
                        type: "benefit"
                        value: 0.30
                        subWeightFrom: "c2"
                      - key: "c22"
                        name: "Arsitektur"
                        type: "benefit"
                        value: 0.30
                        subWeightFrom: "c2"
                      - key: "c23"
                        name: "MEP"
                        type: "benefit"
                        value: 0.40
                        subWeightFrom: "c2"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update weight configuration
      description: |
        Updates the SAW weight configuration. Validation rules:
        - Sum of all top-level weight `value` fields **must equal exactly 1.0** (tolerance: 0.0001).
        - For any criterion with sub-weights, the sum of sub-weight values **must also equal 1.0**.

        Throws `400 Bad Request` if totals are invalid.
        Requires authentication.
      tags: [DSS Engine]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchUpdateWeightsRequest'
            example:
              weights:
                - key: "c1"
                  value: 0.20
                - key: "c2"
                  value: 0.35
                  subWeights:
                    - key: "c21"
                      value: 0.30
                    - key: "c22"
                      value: 0.30
                    - key: "c23"
                      value: 0.40
                - key: "c3"
                  value: 0.20
                - key: "c4"
                  value: 0.15
                - key: "c5"
                  value: 0.10
      responses:
        '200':
          description: Weights updated (returns `true` on success)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebResponse'
                  - type: object
                    properties:
                      data:
                        type: boolean
              example:
                statusCode: 200
                success: true
                message: "Success"
                data: true
        '400':
          description: Weight validation failed (total != 1.0)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 400
                success: false
                message: "Total bobot kriteria harus 1.0 (Sekarang: 0.95)"
                error: "Bad Request"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dss/calculate:
    post:
      summary: Trigger SAW calculation
      description: |
        Triggers the full SAW calculation pipeline and saves a snapshot to the database.

        **Algorithm steps:**
        1. Fetch all top-level weights and expand sub-weights (C2 sub-weights are multiplied by parent weight).
        2. Fetch all buildings that have at least one assessment (latest assessment per building).
        3. Map each building to a criteria matrix: `{c1, c21, c22, c23, c3, c4, c5}`.
           - `c3` is bucketed: `utility > 500 → 3`, `utility >= 100 → 2`, else `1`.
           - `c5` = years since `lastMaintenance`; if never maintained, `c5 = age`.
        4. Normalize each criterion using Min/Max normalization.
        5. Calculate final preference score: `Σ (normalized_value × effective_weight)`.
        6. Assign priority tier: `score > 0.8 → 3 (High)`, `score > 0.5 → 2 (Medium)`, else `1 (Low)`.
        7. Save a `SawRun` record with `SawRunDetail` for each building.

        Returns `true` on success.
        Requires authentication.
      tags: [DSS Engine]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Calculation completed and saved
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/WebResponse'
                  - type: object
                    properties:
                      data:
                        type: boolean
              example:
                statusCode: 200
                success: true
                message: "Success"
                data: true
        '400':
          description: No buildings with assessments found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /dss/runs:
    get:
      summary: Get all SAW calculation runs
      description: |
        Returns the full list of past SAW calculation runs, ordered by most recent first.
        Each run includes its `sawRunDetails` with associated building data.
        Requires authentication.
      tags: [DSS Engine]
      security:
