                message: "Success"
                data:
                  - id: "clxxxxxxxxxxxxxxxxxx"
                    executedAt: "2025-11-29T12:00:00Z"
                    totalBuildings: 15
                    averageScore: 0.612
                    snapshotWeights: {}
                    sawRunDetails: []
        '401':
